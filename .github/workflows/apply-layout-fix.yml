name: Apply layout fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              out = fn(s)
              if out == s:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(out, encoding='utf-8')
              print('Updated', path)

          # Keep short course/class names such as "1st Year" and "2nd Year" on one line in the app tables.
          def nowrap_courses(s):
              s = s.replace(
                  '<span className="rounded-md border border-border/80 bg-muted/40 px-2 py-1">\n                          {s.course}\n                        </span>',
                  '<span className="whitespace-nowrap rounded-md border border-border/80 bg-muted/40 px-2 py-1">\n                          {s.course}\n                        </span>',
              )
              s = s.replace(
                  '<span className="rounded-md border border-border/80 bg-muted/40 px-2 py-0.5">\n                            {s.course}\n                          </span>',
                  '<span className="whitespace-nowrap rounded-md border border-border/80 bg-muted/40 px-2 py-0.5">\n                            {s.course}\n                          </span>',
              )
              return s

          edit('src/routes/_authenticated/students.tsx', nowrap_courses)
          edit('src/routes/_authenticated/dashboard.tsx', nowrap_courses)

          # Excel: every cell's content is vertically + horizontally centered.
          # This applies to Students Directory, Fee Summary, Fee Analytics, Payment History,
          # Male Students and Female Students sheets alike.
          def center_excel(s):
              s = s.replace('horizontal: "left"', 'horizontal: "center"')
              s = s.replace('horizontal: "right"', 'horizontal: "center"')

              # Remove the accidental duplicate Gender header from Students Directory.
              s = s.replace(
                  '    "Remarks / Notes",\n    "Gender",\n  ];',
                  '    "Remarks / Notes",\n  ];',
                  1,
              )

              # Keep the Students Directory footer totals under the correct fee columns.
              old = '''  const footerRow = studentsSheet.addRow([\n    "TOTAL",\n    `Students: ${students.length}`,\n    "",\n    "",\n    "",\n    "",\n    "",\n    metrics.totalBilledFees,\n    metrics.totalFeesCollected,\n    metrics.totalOutstandingFees,\n    "",\n    "",\n  ]);'''
              new = '''  const footerRow = studentsSheet.addRow([\n    "TOTAL",\n    `Students: ${students.length}`,\n    "",\n    "",\n    "",\n    "",\n    "",\n    "",\n    metrics.totalBilledFees,\n    metrics.totalFeesCollected,\n    metrics.totalOutstandingFees,\n    "",\n    "",\n  ]);'''
              if old not in s:
                  raise SystemExit('Students Directory footer block not found')
              s = s.replace(old, new, 1)

              # Ensure all footer numeric cells use number format while staying centered.
              s = s.replace(
                  '    if (colNumber >= 8 && colNumber <= 10) {\n      cell.alignment = { vertical: "middle", horizontal: "center" };',
                  '    if (colNumber >= 9 && colNumber <= 11) {\n      cell.alignment = { vertical: "middle", horizontal: "center" };',
                  1,
              )
              return s

          edit('src/lib/excel-export.ts', center_excel)
          PY

      - name: Commit changes and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-layout-fix.yml
          git add src/routes/_authenticated/students.tsx src/routes/_authenticated/dashboard.tsx src/lib/excel-export.ts
          git commit -m "Fix course layout and center Excel reports [skip ci]"
          git push origin main
