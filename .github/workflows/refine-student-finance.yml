name: Refine Academy Hub finance and Excel
on: push
permissions:
  contents: write
jobs:
  refine:
    if: contains(github.event.head_commit.message, '[finance-refine]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(f,a,b):
              p=Path(f); s=p.read_text(); assert a in s, f'missing {f}: {a[:80]!r}'; p.write_text(s.replace(a,b,1))
          r('src/routes/_authenticated/add-student.tsx','const [amountPaid, setAmountPaid] = useState<string>("0");','const [amountPaid, setAmountPaid] = useState<string>("");')
          r('src/routes/_authenticated/add-student.tsx','setAmountPaid("0");','setAmountPaid("");')
          r('src/routes/_authenticated/add-student.tsx','<span className="text-[11px] text-muted-foreground">Default 0</span>','<span className="text-[11px] text-muted-foreground">Enter manually</span>')
          r('src/routes/_authenticated/add-student.tsx','placeholder="0"\n                    value={amountPaid}','placeholder="e.g. 5000"\n                    value={amountPaid}')
          r('src/routes/_authenticated/add-student.tsx','<div className="grid gap-4 sm:grid-cols-3">','<div className="grid items-start gap-4 sm:grid-cols-3">')
          r('src/routes/_authenticated/add-student.tsx','<label className="text-xs font-medium text-foreground">Gender *</label>','<label className="flex h-5 items-center text-xs font-medium text-foreground">Gender *</label>')
          r('src/features/students/students.storage.ts','    updatedAt: nowIso,\n  };','''    updatedAt: nowIso,
    payments: amountPaid > 0 ? [{
      id: `PAY-ENROLL-${nowDate.getTime()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`,
      studentId: trimmedId,
      studentName: trimmedName,
      amount: amountPaid,
      paymentDate: dateAddedFormatted,
      paymentTime: timeAddedFormatted,
      previousPaid: 0,
      previousRemaining: totalFees,
      newPaid: amountPaid,
      newRemaining: remainingFees,
      recordedBy: getSettings().adminDisplayName || "Admin",
      note: "Enrollment payment",
    }] : undefined,
  };''')
          r('src/components/academy/student-dialogs.tsx','  const [name, setName] = useState("");\n  const [phone, setPhone] = useState("");','  const [name, setName] = useState("");\n  const [gender, setGender] = useState<"Male" | "Female" | "Unspecified">("Unspecified");\n  const [phone, setPhone] = useState("");')
          r('src/components/academy/student-dialogs.tsx','      setName(student.name || "");\n      setPhone(student.phone || "");','      setName(student.name || "");\n      setGender(student.gender || "Unspecified");\n      setPhone(student.phone || "");')
          r('src/components/academy/student-dialogs.tsx','      name: name.trim(),\n      phone: phone.trim() || undefined,','      name: name.trim(),\n      gender,\n      phone: phone.trim() || undefined,')
          r('src/lib/excel-export.ts','''  const studentHeaders = [
    "Sr. #",
    "Student ID",
    "Student Full Name",
    "Phone / WhatsApp",
    "Course / Class",
    "Date Joined",
    "Saved At",
    `Total Fees (${currencyLabel})`,
    `Amount Paid (${currencyLabel})`,
    `Remaining Balance (${currencyLabel})`,
    "Payment Status",
    "Remarks / Notes",
    "Gender",
  ];''','''  const studentHeaders = [
    "Sr. #", "Student ID", "Gender", "Student Full Name", "Phone / WhatsApp", "Course / Class", "Date Joined", "Saved At",
    `Total Fees (${currencyLabel})`, `Amount Paid (${currencyLabel})`, `Remaining Balance (${currencyLabel})`, "Payment Status", "Remarks / Notes",
  ];''')
          r('src/lib/excel-export.ts','''      s.id,
      s.name,
      s.phone || "—",
      s.course || "—",
      s.dateJoined || "—",
      savedTimeDisplay,
      s.totalFees,
      s.amountPaid,
      currentRemaining,
      currentStatus,
      s.notes || "—",
      s.gender || "Unspecified",
    ]);''','''      s.id, s.gender || "Unspecified", s.name, s.phone || "—", s.course || "—", s.dateJoined || "—", savedTimeDisplay,
      s.totalFees, s.amountPaid, currentRemaining, currentStatus, s.notes || "—",
    ]);''')
          r('src/lib/excel-export.ts','if (colNumber === 1 || colNumber === 2 || colNumber === 6 || colNumber === 7) {','if (colNumber === 1 || colNumber === 2 || colNumber === 3 || colNumber === 7 || colNumber === 8) {')
          r('src/lib/excel-export.ts','      } else if (colNumber >= 8 && colNumber <= 10) {','      } else if (colNumber >= 9 && colNumber <= 11) {')
          r('src/lib/excel-export.ts','      } else if (colNumber === 11) {','      } else if (colNumber === 12) {')
          r('src/lib/excel-export.ts','if (colNumber >= 8 && colNumber <= 10) {','if (colNumber >= 9 && colNumber <= 11) {')
          r('src/lib/excel-export.ts','{ width: 8 }, // Sr. #\n    { width: 16 }, // Student ID\n    { width: 28 }, // Student Name','{ width: 8 }, // Sr. #\n    { width: 16 }, // Student ID\n    { width: 14 }, // Gender\n    { width: 28 }, // Student Name')
          r('src/lib/excel-export.ts','    { width: 34 }, // Remarks / Notes\n    { width: 14 }, // Gender\n  ];','    { width: 34 }, // Remarks / Notes\n  ];')
          p=Path('src/lib/excel-export.ts'); s=p.read_text(); a=s.index('  (["Male", "Female"] as const).forEach((gender) => {'); b=s.index('\n\n  // Generate buffer and trigger download',a)
          block='''  (["Male", "Female"] as const).forEach((gender) => {
    const sheet = workbook.addWorksheet(`${gender} Students`, { views: [{ state: "frozen", ySplit: 7, showGridLines: true }] });
    const matching = students.filter((s) => (s.gender || "Unspecified") === gender);
    const m = calculateMetrics(matching);
    const rate = m.totalBilledFees > 0 ? (m.totalFeesCollected / m.totalBilledFees) * 100 : 0;
    sheet.mergeCells("A1:M1"); sheet.getCell("A1").value=`${academyName.toUpperCase()} — ${gender.toUpperCase()} STUDENTS`; sheet.getCell("A1").font={name:"Segoe UI",size:16,bold:true,color:{argb:"FFFFFFFF"}}; sheet.getCell("A1").fill={type:"pattern",pattern:"solid",fgColor:{argb:`FF${navyAccent}`}}; sheet.getCell("A1").alignment={vertical:"middle",horizontal:"center"}; sheet.getRow(1).height=36;
    sheet.mergeCells("A2:M2"); sheet.getCell("A2").value=`${gender.toUpperCase()} STUDENT DIRECTORY & FEE COLLECTION`; sheet.getCell("A2").font={name:"Segoe UI",size:11,bold:true,color:{argb:"FF38BDF8"}}; sheet.getCell("A2").fill={type:"pattern",pattern:"solid",fgColor:{argb:`FF${navyDark}`}}; sheet.getCell("A2").alignment={vertical:"middle",horizontal:"center"}; sheet.getRow(2).height=24;
    sheet.mergeCells("A3:M3"); sheet.getCell("A3").value=`Institution: ${academyName}  |  Admin: ${settings.adminDisplayName}  |  Session: ${settings.academicSession}  |  Export Generated: ${formattedDateTime}  |  Total ${gender}: ${matching.length}`; sheet.getCell("A3").font={name:"Segoe UI",size:9.5,italic:true,color:{argb:"FF475569"}}; sheet.getCell("A3").fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF1F5F9"}}; sheet.getCell("A3").alignment={vertical:"middle",horizontal:"center"}; sheet.getRow(3).height=22; sheet.getRow(4).height=10;
    [["A5:C5",`Total Billed: ${currencyLabel} ${m.totalBilledFees.toLocaleString()}`],["D5:F5",`Total Collected: ${currencyLabel} ${m.totalFeesCollected.toLocaleString()}`],["G5:I5",`Total Outstanding: ${currencyLabel} ${m.totalOutstandingFees.toLocaleString()}`],["J5:L5",`Collection Rate: ${rate.toFixed(1)}%`]].forEach(([range,value],i)=>{sheet.mergeCells(range);const c=sheet.getCell(range.split(":")[0]);c.value=value;c.font={name:"Segoe UI",size:10,bold:true};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:["FFE2E8F0","FFDCFCE7","FFFEF3C7","FFDBEAFE"][i]}};c.alignment={vertical:"middle",horizontal:"center"};}); sheet.getRow(5).height=26; sheet.getRow(6).height=10;
    const headers=["Sr. #","Student ID","Gender","Student Full Name","Phone / WhatsApp","Course / Class","Date Joined","Saved At",`Total Fees (${currencyLabel})`,`Amount Paid (${currencyLabel})`,`Remaining Balance (${currencyLabel})`,"Payment Status","Remarks / Notes"]; const hr=sheet.getRow(7); hr.values=headers; hr.height=28; hr.eachCell(c=>{c.font={name:"Segoe UI",size:10.5,bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:`FF${navyDark}`}};c.alignment={vertical:"middle",horizontal:"center",wrapText:true};}); sheet.autoFilter={from:{row:7,column:1},to:{row:7,column:13}};
    matching.forEach((s,i)=>{const row=sheet.addRow([i+1,s.id,gender,s.name,s.phone||"—",s.course||"—",s.dateJoined||"—",getStudentSavedAt(s),s.totalFees,s.amountPaid,computeRemaining(s.totalFees,s.amountPaid),computeStudentStatus(s.totalFees,s.amountPaid),s.notes||"—"]); row.height=22; row.eachCell((c,col)=>{c.font={name:"Segoe UI",size:10,color:{argb:"FF0F172A"}}; if(i%2)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:`FF${lightZebra}`}}; c.border={top:{style:"thin",color:{argb:`FF${borderSlate}`}},bottom:{style:"thin",color:{argb:`FF${borderSlate}`}},left:{style:"thin",color:{argb:`FF${borderSlate}`}},right:{style:"thin",color:{argb:`FF${borderSlate}`}}}; if([1,2,3,7,8,12].includes(col))c.alignment={vertical:"middle",horizontal:"center"}; else if(col>=9&&col<=11){c.alignment={vertical:"middle",horizontal:"right"};c.numFmt="#,##0";} else c.alignment={vertical:"middle",horizontal:"left"};});});
    const f=sheet.addRow(["TOTAL",`Students: ${matching.length}`,"","","","","","",m.totalBilledFees,m.totalFeesCollected,m.totalOutstandingFees,"",""]); f.height=26; f.eachCell((c,col)=>{c.font={name:"Segoe UI",size:10.5,bold:true};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE2E8F0"}};if(col>=9&&col<=11){c.alignment={vertical:"middle",horizontal:"right"};c.numFmt="#,##0";}});
    sheet.columns=[{width:8},{width:16},{width:14},{width:28},{width:18},{width:24},{width:15},{width:22},{width:18},{width:18},{width:20},{width:16},{width:34}];
  });'''
          p.write_text(s[:a]+block+s[b:])
          Path('src/finance-excel-refine.trigger').unlink(missing_ok=True)
          PY
      - name: Build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "Refine student payment entry and Excel reports [finance-final]"
          git push
          git rm .github/workflows/refine-student-finance.yml
          git commit -m "Remove temporary finance refinement workflow [cleanup]"
          git push
